[project]
name = "rag-coda-slack"
version = "0.1.0"
description = ""
authors = [
    {name = "Francesco Scuderi",email = "frascuderi05@gmail.com"}
]
requires-python = "~3.12, <4.0.0"
dependencies = [
    "slack-bolt (>=1.27.0,<2.0.0)",
    "fastapi (>=0.133.1,<0.134.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "langchain (>=1.2.10,<2.0.0)",
    "chromadb (>=1.5.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-core (>=1.2.17,<2.0.0)",
    "langchain-classic (>=1.0.1,<2.0.0)",
    "langchain-cohere (>=0.5.0,<0.6.0)",
    "langchain-pinecone (>=0.2.13,<0.3.0)",
    "pinecone-client (>=6.0.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "ruff (>=0.15.2,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)"
]
